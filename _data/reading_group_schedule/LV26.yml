  - date: "2026-09-02"
    time: "11:00"
    kind: seminar
    form: AI Hub Conference
    room: Maths, L1
    speaker: Coralia Cartis
    speaker_affiliation: University of Oxford
    title: "Towards understanding feature learning: low-rank functions and data properties"
    abstract: "Low-rank or multi-index functions appear in both optimization and machine learning, displaying structure simplicity that allows dimensionality reduction and captures the important directions of variation of the landscape. This allows efficient optimization and learning or generalisation. We will discuss some relatively new occurrences of low rank objectives, such as when considering trained nets as functions of the training data, and the implications of this on robustness of training and the learning of important features. Time permitting, we will also discuss training data recovery algorithms, where we show both theoretically and numerically that given final and initial parameters of the trained network, as well as access to network gradients, and provided the network is sufficiently (but finitely) wide, we can recover training data samples to desired accuracy efficiently, by using only a subset of the parameters and low-rank properties of the data. Throughout our work, we will discover interesting connections between the data and the parameters of deep neural networks."
  - date: "2026-09-15"
    time: "14:00"
    kind: seminar
    form: CIMDA Seminar
    room: Maths, L3
    speaker: Hong Yan
    speaker_affiliation: City University of Hong Kong
    title: "Efficient Machine Learning Methods Based on Matrix and Tensor CUR Decomposition"
    abstract: "The training of large deep neural networks can be very expensive in term of long computing time, which requires costly equipment and high energy consumption. Vector, matrix and tensor multiplications are among the most time-consuming tasks. In this talk, a CUR decomposition-based method will be presented to reduce the computational complexity. Our basic strategy is to approximate a large low-rank matrix as a product of three much smaller matrices. Then multiplications with these matrices become very efficient. This can increase the speed of the self-attention operations in transformers significantly. Another reason for the long computing time in neural network training is that a large training dataset is needed. Our research group has recently studied a pattern matching method that requires only a small number of training samples. To achieve high accuracy and reliability, we use high-order pattern matching based on hypergraph and tensor models. A difficulty with this approach is that the high-order compatibility tensor is very large. Employing tensor CUR decomposition, we have tackled this problem and proposed an efficient pattern matching algorithm. Based on pattern matching, we have recently developed an intelligent indoor positioning and navigation system, which will be demonstrated in this talk."
    speaker_bio: "Prof Hong Yan received his PhD degree from Yale University. He was Professor of Imaging Science at the University of Sydney and currently is Wong Chun Hong Professor of Data Engineering and Chair Professor of Computer Engineering at City University of Hong Kong. Professor Yan's research interests include AI, bioinformatics, pattern recognition, and signal and image processing. He has over 600 journal and conference publications in these areas. Professor Yan is an IEEE Fellow, IAPR Fellow, Foreign Member of the European Academy of Sciences and Arts, and Fellow of the US National Academy of Inventors. He received the 2016 Norbert Wiener Award from the IEEE SMC Society for contributions to image and biomolecular pattern recognition techniques."
