  - date: "2026-11-17"
    time: "11:00"
    kind: reading-group
    form: Reading Group
    room: Maths, S2.37
    speaker: Torkel Loman
    speaker_affiliation: University of Oxford
    title: Function inference and identifiability for differential equations
    abstract: "Mathematical models are used to understand, predict and control systems, from the spread of epidemics to the flight of aircraft. Building a model, however, requires the system's mechanisms to be known, which rules out many applications, such as a newly emerged disease whose transmission is not yet understood. The nascent field of scientific machine learning (SciML) addresses this through hybrid mathematical/AI models, which describe the known mechanisms with mathematical equations and learn the unknown parts with neural networks. Their flexibility comes at a price: hybrid models are prone to fitting the data perfectly while learning erroneous system dynamics. In this talk, I will introduce hybrid modelling and identifiability analysis, which tells us when such a model can learn the true dynamics and, after training, whether it has."
