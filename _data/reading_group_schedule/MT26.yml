  - date: "2026-11-03"
    time: "11:00"
    kind: reading-group
    form: Reading Group
    room: Maths, S2.37
    speaker: Elizaveta Rebrova
    speaker_affiliation: University of Oxford
    title: How accurately should we solve the subproblems? Randomized inner solvers within optimization methods
    abstract: >
      Many optimization methods reduce a hard problem to a sequence of simpler subproblems, such as a Newton system or a proximal step. In large-scale settings these subproblems are themselves can be solved by iterative, often randomized, methods. Then, how accurately should each subproblem be solved? Solving it to high precision can dominate the overall cost, while solving it too loosely can slow down the outer method or make its output less reliable. I will discuss how the answer depends on what the outer method needs to deliver, and how the structure of the inner solver can be used to control the price of inexactness.
      
      Specifically, I will first discuss online Newton methods with accelerated sketch-and-project as the inner solver. Here inexactness costs statistical efficiency, which momentum acceleration helps recover at no extra cost per step. I will then discuss ongoing work on inexact proximal point methods, including ADMM and other splitting schemes. There, a relative error criterion yields bounds on the total inner work and guidance on how inexact the inner solves can be.
      
      This is based on the joint work with Michal Derezinski, Sen Na, Xinchen Du, Bartolomeo Stellato and Pranav Reddy.
  - date: "2026-11-05"
    time: "14:00"
    kind: seminar
    form: Seminar
    room: Maths, L3
    speaker: Sara Shashaani
    speaker_affiliation: North Carolina State University
    title: Adaptive Sampling and Regularization for Stochastic Trust-region Methods
    abstract: Trust-region methods have proven highly effective for unconstrained nonconvex stochastic optimization problems where objective and gradient information are available only through noisy stochastic oracles. ASTRO is a class of adaptive sampling trust-region methods that dynamically determine sampling effort while constructing local quadratic models from noisy function and gradient observations. By exploiting dependence among samples and the stochastic structure of the problem, ASTRO achieves strong convergence and complexity guarantees. Its derivative-free variant, ASTRO-DF, relies solely on noisy function evaluations and also enjoys almost-sure convergence guarantees.
